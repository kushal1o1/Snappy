<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
 <header class="header">
  <div class="brand">
    <span class="brand-name">Snappy</span>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="searchToggle" aria-label="Search snapshots" title="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="btn-icon" id="settingsToggle" aria-label="Settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="capture-band">
  <button class="capture-btn" id="captureBtn" title="Capture tabs" aria-label="Capture tabs">
    <img src="icons/icon128.png" alt="" class="capture-icon">
  </button>
  <span class="capture-label" id="captureLabel">Capture tabs</span>
</div>

  <div class="search-bar" id="searchBar">
    <input type="text" class="search-input" id="searchInput" placeholder="Search snapshots...">
  </div>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <span class="setting-label">Capture sound</span>
      <label class="toggle">
        <input type="checkbox" id="settingSound">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <span class="setting-label">Delete after restore</span>
      <label class="toggle">
        <input type="checkbox" id="settingDeleteAfterRestore">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <span class="setting-label">Restore into</span>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="restoreTarget" value="this"> This window
        </label>
        <label class="radio-label">
          <input type="radio" name="restoreTarget" value="new"> New window
        </label>
      </div>
    </div>
  </div>
  <main class="snapshot-list" id="snapshotList"></main>
  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
